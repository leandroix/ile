<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" id="meta-theme" content="#5c1a1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Asé Ogun"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title id="pg-title">Asé Ogun dá lè ko</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<!-- Firebase SDKs (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
:root{
  --p:#5c1a1a; --pm:#7a2222; --pp:rgba(92,26,26,.08); --pmut:rgba(92,26,26,.25);
  --amb:#b8860b; --amby:#fdf8dc; --red:#8b0000; --redp:#fdeaea;
  --tm:#1a1410; --tmu:#6b5040; --tl:#9e8070;
  --sf:#fdf8f4; --bg:#fff; --bo:rgba(92,26,26,.15);
  --rsm:8px; --rmd:14px; --rlg:22px;
  --fs:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--sf);font-family:var(--sans);color:var(--tm)}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;background:var(--bg);position:relative}

/* TOPBAR */
.tb{background:var(--p);padding:calc(12px + var(--st)) 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:10}
.nav-desk{display:none}
.ibtn-wrap{display:flex;gap:8px}
.tbname{font-family:var(--fs);font-size:18px;font-weight:600;color:#fff;line-height:1.15}
.tbsub{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.05em;text-transform:uppercase}
.ibtn{background:rgba(255,255,255,.14);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}

/* NAV */
.nav{display:flex;background:var(--bg);border-bottom:1px solid var(--bo);flex-shrink:0;position:relative;z-index:10;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nb{flex:1;min-width:52px;padding:8px 2px 7px;border:none;background:transparent;color:var(--tl);font-family:var(--sans);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}
.nb.on{color:var(--pm)}
.nb.on svg{stroke-width:2.4}

/* PAGES */
.pages{flex:1;overflow:hidden;position:relative}
.pg{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--sb));display:none}
.pg.on{display:block}
.pi{padding:16px}

/* TYPOGRAPHY */
.ptit{font-family:var(--fs);font-size:23px;font-weight:600;color:var(--tm);margin-bottom:3px}
.psub{font-size:13px;color:var(--tmu);margin-bottom:14px}
.slbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tl);margin:16px 0 8px}

/* VITRINE */
.vwrap{overflow:hidden;background:#111;flex-shrink:0}
.vtrack{display:flex;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.vslide{flex-shrink:0;width:100%;min-height:170px;max-height:240px;position:relative;display:flex;align-items:flex-end}
.vslide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 65%)}
.vc{position:relative;z-index:2;padding:14px;width:100%}
.vslide.txt{min-height:140px}
.vslide.txt .vc{padding:20px 16px}
.vtit{font-family:var(--fs);font-size:18px;font-weight:600;color:#fff;line-height:1.2;margin-bottom:3px}
.vbody{font-size:13px;color:rgba(255,255,255,.85);line-height:1.5;white-space:pre-line}
.vlink{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);color:#fff;font-size:12px;padding:5px 13px;border-radius:20px;text-decoration:none;border:1px solid rgba(255,255,255,.3)}
.vdots{display:flex;justify-content:center;gap:5px;padding:7px 0 3px;background:var(--bg)}
.vdot{width:6px;height:6px;border-radius:50%;background:var(--bo);cursor:pointer;transition:all .2s}
.vdot.on{background:var(--p);width:14px;border-radius:3px}
.vslide{cursor:pointer}

/* Vitrine modal */
.vmodal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto}
.vmodal.on{display:flex}
.vmodal-close{position:fixed;top:calc(14px + var(--ss));right:16px;z-index:301;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;backdrop-filter:blur(4px)}
.vmodal-img{width:100%;max-width:600px;max-height:70vh;object-fit:contain;border-radius:0 0 12px 12px}
.vmodal-txt{width:100%;max-width:600px;padding:20px 20px calc(32px + var(--sb));flex:1}
.vmodal-title{font-family:var(--fs);font-size:22px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:10px}
.vmodal-body{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;white-space:pre-line;margin-bottom:16px}
.vmodal-link{display:inline-block;background:var(--p);color:#fff;font-size:14px;padding:10px 22px;border-radius:22px;text-decoration:none;font-weight:500}

/* HOME MINI PANEL */
.mpanel{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 4px}
.mcard{background:var(--sf);border:1px solid var(--bo);border-radius:var(--rmd);padding:12px 14px}
.mlbl{font-size:11px;color:var(--tmu);margin-bottom:4px}
.mval{font-family:var(--fs);font-size:21px;font-weight:600;line-height:1}
.mval.g{color:#2d6b27}
.mval.r{color:var(--red)}

/* CARD */
.card{background:var(--bg);border:1px solid var(--bo);border-radius:var(--rmd);padding:13px 15px;margin-bottom:10px}

/* MEMBERS */
.swrap{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bo);border-radius:var(--rmd);padding:9px 12px;margin-bottom:12px}
.swrap svg{width:15px;height:15px;stroke:var(--tl);fill:none;flex-shrink:0}
.swrap input{border:none;background:transparent;font-family:var(--sans);font-size:14px;color:var(--tm);width:100%;outline:none}
.mi{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--bo);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mi:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--pp);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--pm);flex-shrink:0;border:1.5px solid var(--pmut);background-size:cover;background-position:center}
.mname{font-size:14px;color:var(--tm)}
.mrole{font-size:12px;color:var(--tmu);margin-top:1px}

/* FAB */
.fabw{position:sticky;bottom:16px;display:flex;justify-content:flex-end;margin-top:10px;padding:0 16px}
.fab{background:var(--p);color:#fff;border:none;border-radius:50px;padding:11px 18px;font-size:13px;font-family:var(--sans);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(92,26,26,.38);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.fab svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-linecap:round;stroke-width:2.5}

/* CALENDAR */
.cnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.carr{background:var(--sf);border:1px solid var(--bo);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.carr svg{width:14px;height:14px;stroke:var(--tmu);fill:none;stroke-linecap:round}
.cml{font-family:var(--fs);font-size:17px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px;margin-bottom:12px}
.cdow{font-size:10px;color:var(--tl);padding:4px 0}
.cday{font-size:13px;padding:7px 0;border-radius:50%;cursor:pointer;position:relative;color:var(--tm);-webkit-tap-highlight-color:transparent}
.cday.today{background:var(--p);color:#fff;font-weight:500}
.cday.hev::after{content:'';width:4px;height:4px;background:var(--amb);border-radius:50%;position:absolute;bottom:1px;left:50%;transform:translateX(-50%)}

/* FINANCE */
.tabrow{display:flex;background:var(--sf);border-radius:var(--rmd);padding:4px;gap:3px;margin-bottom:12px}
.tbbtn{flex:1;padding:7px 4px;border:none;background:transparent;border-radius:var(--rsm);font-size:12px;font-family:var(--sans);color:var(--tmu);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tbbtn.on{background:var(--bg);color:var(--p);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pcard{background:var(--p);border-radius:var(--rlg);padding:16px;margin-bottom:12px;color:#fff}
.plbl{font-size:11px;opacity:.7;margin-bottom:3px}
.pamt{font-family:var(--fs);font-size:26px;font-weight:600;margin-bottom:8px}
.pbar{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-bottom:6px}
.pfill{height:100%;background:#f0c060;border-radius:3px}
.pmeta{display:flex;justify-content:space-between;font-size:11px;opacity:.75}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--bo);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--tmu);font-family:var(--sans);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}

/* CONFIG */
.crow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bo);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.crow:last-child{border-bottom:none}
.cl{font-size:14px;color:var(--tm)}
.cs{font-size:12px;color:var(--tmu);margin-top:2px}
.ca svg{width:14px;height:14px;fill:none;stroke:var(--tl);stroke-linecap:round}
.csw{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;-webkit-tap-highlight-color:transparent}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--p);transform:scale(1.08)}
.rwrap{display:flex;flex-wrap:wrap;padding:6px 0}

/* OVERLAY / SHEET */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;align-items:flex-end;justify-content:center;-webkit-tap-highlight-color:transparent}
.ov.on{display:flex}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;padding:20px 17px calc(26px + var(--sb));width:100%;max-width:430px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh{width:36px;height:4px;background:var(--bo);border-radius:2px;margin:0 auto 15px}
.stit{font-family:var(--fs);font-size:18px;font-weight:600;margin-bottom:13px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;color:var(--tmu);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--bo);border-radius:var(--rsm);padding:9px 11px;font-size:14px;font-family:var(--sans);background:var(--sf);color:var(--tm);outline:none}
.fld textarea{resize:vertical;min-height:76px}
.sbtns{display:flex;gap:8px;margin-top:14px}
.sbtns button{flex:1;padding:11px;border-radius:var(--rsm);font-size:14px;font-family:var(--sans);cursor:pointer;border:none}
.bcancel{background:var(--sf);color:var(--tmu)}
.bsave{background:var(--p);color:#fff}
.boutl{width:100%;background:transparent;color:var(--pm);border:1.5px solid var(--pm);border-radius:var(--rmd);padding:11px;font-size:14px;font-family:var(--sans);cursor:pointer;margin-top:5px}
.bdanger{width:100%;background:var(--redp);color:var(--red);border:none;border-radius:var(--rmd);padding:11px;font-size:14px;font-family:var(--sans);cursor:pointer;margin-top:5px}

/* TOAST */
.toast{position:fixed;bottom:calc(68px + var(--sb));left:50%;transform:translateX(-50%) translateY(20px);background:var(--p);color:#fff;padding:9px 18px;border-radius:50px;font-size:13px;opacity:0;transition:all .25s;z-index:300;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* RESPONSIVE BASE */
@media(max-width:767px){
  html,body{height:100%;overflow:hidden;background:var(--sf)}
}
@media(min-width:768px){
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  #app{max-width:100%;width:100%;height:100vh;flex-direction:row;margin:0}
  .tb{width:230px;flex-shrink:0;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:24px 16px 20px;height:100%;border-right:1px solid var(--bo)}
  .nav{display:none}
  .nav-desk{display:flex;flex-direction:column;gap:2px;margin-top:8px;width:100%}
  .nb-desk{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--rsm);border:none;background:transparent;color:var(--tm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;text-align:left;width:100%}
  .nb-desk.on{background:var(--pp);color:var(--p);font-weight:600}
  .pages{flex:1;position:relative}
  .pg{padding:28px 36px}
  .ov{align-items:center;justify-content:flex-end}
  .sheet{border-radius:0;height:100%;max-height:100%;max-width:420px;width:100%;border-left:1px solid var(--bo)}
}
</style>
</head>
<body>

<div id="app">

<!-- SIDEBAR / TOPBAR -->
<div class="tb">
  <div class="tb-brand">
    <div class="tbname" id="tname">Asé Ogun dá lè ko</div>
    <div class="tbsub">Painel do barracão</div>
  </div>
  
  <nav class="nav-desk" id="nav-desk">
    <button class="nb-desk on" onclick="goTo('home',this)">Início</button>
    <button class="nb-desk" onclick="goTo('members',this)">Filhos de Santo</button>
    <button class="nb-desk" onclick="goTo('calendar',this)">Agenda</button>
    <button class="nb-desk" onclick="goTo('finance',this)">Finanças</button>
    <button class="nb-desk" onclick="openOv('ov-admin-menu')">⚙️ Configurações</button>
  </nav>
</div>

<!-- MOBILE NAV -->
<nav class="nav" id="mainnav">
  <button class="nb on" onclick="goTo('home',this)">Início</button>
  <button class="nb" onclick="goTo('members',this)">Filhos</button>
  <button class="nb" onclick="goTo('calendar',this)">Agenda</button>
  <button class="nb" onclick="goTo('finance',this)">Finanças</button>
  <button class="nb" onclick="openOv('ov-admin-menu')">⚙️ Configs</button>
</nav>

<!-- PAGES -->
<div class="pages">

  <!-- HOME -->
  <div class="pg on" id="pg-home">
    <div class="vwrap"><div class="vtrack" id="vtrack"></div></div>
    <div class="vdots" id="vdots"></div>
    <div class="pi">
      <div class="slbl">Próximos eventos</div>
      <div class="card" id="home-events"></div>
    </div>
  </div>

  <!-- MEMBERS -->
  <div class="pg" id="pg-members">
    <div class="pi">
      <div class="ptit">Filhos de Santo</div>
      <div class="psub" id="mem-count">0 cadastrados</div>
      <div class="swrap"><input type="text" placeholder="Buscar..." oninput="filterMembers(this.value)"/></div>
      <div class="card" id="members-list"></div>
      <div class="fabw"><button class="fab" onclick="openNewMember()">+ Novo filho(a)</button></div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="pg" id="pg-calendar">
    <div class="pi">
      <div class="ptit">Agenda</div>
      <div class="cnav">
        <button class="carr" onclick="changeMonth(-1)">◀</button>
        <span class="cml" id="cal-lbl">Junho 2026</span>
        <button class="carr" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="cgrid" id="cal-grid"></div>
    </div>
  </div>

  <!-- FINANCE -->
  <div class="pg" id="pg-finance">
    <div class="pi">
      <div class="ptit">Finanças</div>
      <div class="mpanel">
        <div class="mcard"><div class="mlbl">Arrecadado</div><div class="mval g" id="h-rec">R$0</div></div>
        <div class="mcard"><div class="mlbl">Despesas</div><div class="mval r" id="h-desp">R$0</div></div>
      </div>
    </div>
  </div>

</div>
</div>

<!-- ADMIN MENU OVERLAY -->
<div class="ov" id="ov-admin-menu" onclick="if(event.target===this)closeOv('ov-admin-menu')">
<div class="sheet">
  <div class="sh"></div>
  <div class="stit">Administração</div>
  <div class="slbl">Vitrine</div>
  <div class="card">
    <button class="boutl" onclick="openOv('ov-newslide')">+ Novo card na vitrine</button>
  </div>
  <button class="bsave" style="width:100%; padding:12px;" onclick="closeOv('ov-admin-menu')">Fechar</button>
</div>
</div>

<!-- NEW SLIDE OVERLAY (VITRINE) -->
<div class="ov" id="ov-newslide" style="z-index:400" onclick="if(event.target===this)closeOv('ov-newslide')">
<div class="sheet">
  <div class="sh"></div>
  <div class="stit">Novo card na vitrine</div>
  <div class="fld">
    <label>Tipo</label>
    <select id="sl-type" onchange="toggleSlideF()">
      <option value="text">Somente texto</option>
      <option value="image">Imagem + texto</option>
    </select>
  </div>
  <div class="fld"><label>Título *</label><input id="sl-title" type="text" placeholder="Ex: Obrigação de Ogun"/></div>
  <div class="fld"><label>Mensagem</label><textarea id="sl-body" placeholder="Texto do card..."></textarea></div>
  
  <div id="slf-file" class="fld" style="display:none">
    <label>Enviar Imagem</label>
    <input id="sl-img-file" type="file" accept="image/*" onchange="uploadToCloudinary(this, 'sl-prev-img', 'sl-img-url', 'sl-photo-status')"/>
    <input id="sl-img-url" type="hidden" value=""/>
    <div id="sl-photo-status" style="font-size:11px;color:var(--tmu);margin-top:4px">Aguardando arquivo...</div>
  </div>
  <div id="slf-prev" style="display:none;margin-bottom:9px">
    <img id="sl-prev-img" style="width:100%;max-height:130px;object-fit:cover;border-radius:9px"/>
  </div>
  
  <div class="fld"><label>Cor de fundo</label><input id="sl-color" type="color" value="#5c1a1a"/></div>
  <div class="sbtns">
    <button class="bcancel" onclick="closeOv('ov-newslide')">Cancelar</button>
    <button class="bsave" onclick="addSlide()">Publicar</button>
  </div>
</div>
</div>

<!-- NEW MEMBER OVERLAY -->
<div class="ov" id="ov-newmem" onclick="if(event.target===this)closeOv('ov-newmem')">
<div class="sheet">
  <div class="sh"></div>
  <div class="stit">Novo filho(a) de santo</div>
  <div class="fld">
    <label>Foto do membro</label>
    <div id="nm-photo-wrap" style="display:flex;flex-direction:column;gap:8px">
      <div id="nm-photo-prev" style="width:72px;height:72px;border-radius:50%;background:var(--pp);display:flex;align-items:center;justify-content:center;font-size:28px;border:2px dashed var(--pmut);overflow:hidden;margin:0 auto;cursor:pointer" onclick="document.getElementById('nm-photo-file').click()">📷</div>
      <input id="nm-photo-file" type="file" accept="image/*" style="display:none" onchange="uploadToCloudinary(this,'nm-photo-prev','nm-photo-url','nm-photo-status')"/>
      <input id="nm-photo-url" type="hidden" value=""/>
      <div id="nm-photo-status" style="font-size:11px;color:var(--tmu);text-align:center">Clique na foto para fazer o upload</div>
    </div>
  </div>
  <div class="fld"><label>Nome completo *</label><input id="nm-nome" type="text" placeholder="Maria Aparecida"/></div>
  <div class="fld"><label>Função no axé</label><input id="nm-role" type="text" placeholder="Ex: Yaô, Ogã..."/></div>
  <div class="fld"><label>Orixá</label><input id="nm-orixa" type="text" placeholder="Ex: Ogum"/></div>
  <div class="sbtns"><button class="bcancel" onclick="closeOv('ov-newmem')">Cancelar</button><button class="bsave" onclick="addMember()">Salvar</button></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='ase_v5';
let S={
  cloudName: 'seu-cloud-name', // Preencha com o seu cloudname do Cloudinary
  cloudPreset: 'seu-upload-preset', // Preencha com o seu upload preset não assinado
  slides:[
    {id:1,type:'text',title:'Bem-vindo ao axé!',body:'Que Ogun abra os seus caminhos.',color:'#5c1a1a',imgUrl:''},
  ],
  members:[
    {id:1,name:'Maria Aparecida',role:'Yá Lorixá',orixa:'Oxum',photoUrl:''},
  ]
};

function loadS(){try{const d=localStorage.getItem(KEY);if(d){S=JSON.parse(d);}}catch(e){}}
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
loadS();

function openOv(id){ document.getElementById(id).style.display='flex'; }
function closeOv(id){ document.getElementById(id).style.display='none'; }

function showToast(txt){
  const t=document.getElementById('toast');t.textContent=txt;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2500);
}

function goTo(pgId, btn){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb, .nb-desk').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+pgId).classList.add('on');
  if(btn) btn.classList.add('on');
}

function toggleSlideF(){
  const type = document.getElementById('sl-type').value;
  document.getElementById('slf-file').style.display = type==='image'?'block':'none';
  document.getElementById('slf-prev').style.display = type==='image'?'block':'none';
}

function openNewMember(){ openOv('ov-newmem'); }

// ══ FUNÇÃO DE UPLOAD REAL PARA O CLOUDINARY ══════════════
function uploadToCloudinary(input, prevId, urlInputId, statusId) {
  const file = input.files[0];
  const statusEl = document.getElementById(statusId);
  const prevEl = document.getElementById(prevId);
  const urlInput = document.getElementById(urlInputId);

  if (!file) return;

  if (S.cloudName === 'seu-cloud-name' || S.cloudPreset === 'seu-upload-preset') {
    statusEl.innerHTML = "❌ Configure o CloudName e o Preset no código JS.";
    statusEl.style.color = "red";
    return;
  }

  statusEl.textContent = "⌛ Carregando imagem...";
  statusEl.style.color = "orange";

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', S.cloudPreset);

  fetch(`https://api.cloudinary.com/v1_1/${S.cloudName}/image/upload`, {
    method: 'POST',
    body: formData
  })
  .then(res => {
    if (!res.ok) throw new Error('Erro na resposta do servidor.');
    return res.json();
  })
  .then(data => {
    if (data.secure_url) {
      urlInput.value = data.secure_url;
      statusEl.textContent = "✅ Upload concluído com sucesso!";
      statusEl.style.color = "green";
      
      if (prevEl.tagName === 'IMG') {
        prevEl.src = data.secure_url;
      } else {
        prevEl.innerHTML = "";
        prevEl.style.backgroundImage = `url('${data.secure_url}')`;
      }
    }
  })
  .catch(err => {
    console.error(err);
    statusEl.textContent = "❌ Falha ao carregar imagem.";
    statusEl.style.color = "red";
  });
}

function addMember(){
  const name=document.getElementById('nm-nome').value;
  const role=document.getElementById('nm-role').value;
  const orixa=document.getElementById('nm-orixa').value;
  const photoUrl=document.getElementById('nm-photo-url').value;

  if(!name){ showToast('Digite o nome!'); return; }

  S.members.push({id:Date.now(), name, role, orixa, photoUrl});
  saveS(); renderMembers(); closeOv('ov-newmem');
  showToast('Filho(a) cadastrado(a)!');
}

function renderMembers(){
  const w=document.getElementById('members-list');
  document.getElementById('mem-count').textContent=`${S.members.length} cadastrados`;
  w.innerHTML=S.members.map(m=>`
    <div class="mi">
      <div class="av" style="${m.photoUrl ? `background-image:url('${m.photoUrl}')` : ''}">${m.photoUrl?'':'👤'}</div>
      <div>
        <div class="mname"><strong>${m.name}</strong></div>
        <div class="mrole">${m.role} de ${m.orixa}</div>
      </div>
    </div>
  `).join('');
}

function addSlide(){
  const type=document.getElementById('sl-type').value;
  const title=document.getElementById('sl-title').value;
  const body=document.getElementById('sl-body').value;
  const color=document.getElementById('sl-color').value;
  const imgUrl=document.getElementById('sl-img-url').value;

  if(!title){ showToast('Digite o título!'); return; }

  S.slides.push({id:Date.now(), type, title, body, color, imgUrl});
  saveS(); renderVitrine(); closeOv('ov-newslide');
  showToast('Card publicado!');
}

function renderVitrine(){
  const track=document.getElementById('vtrack');
  const dots=document.getElementById('vdots');
  if(!track) return;

  track.innerHTML=S.slides.map(s=>`
    <div class="vslide ${s.type}" style="background:${s.color}">
      ${s.imgUrl ? `<img src="${s.imgUrl}"/>` : ''}
      <div class="vov"></div>
      <div class="vc">
        <div class="vtit">${s.title}</div>
        <div class="vbody">${s.body}</div>
      </div>
    </div>
  `).join('');

  dots.innerHTML=S.slides.map((s,i)=>`<div class="vdot ${i===0?'on':''}"></div>`).join('');
}

window.onload=function(){
  renderVitrine();
  renderMembers();
}
</script>
</body>
</html>
